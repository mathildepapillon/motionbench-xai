_target_: motionbench.data.synthetic.gaussian_motion.GaussianMotionDataset
# Shape parameters — same field as the gaussian_k4 baseline, but labelled by
# the paper's stated Olsen interaction (label_functions.OlsenInteraction)
# instead of the joint-0 grand-mean proxy the pillar configs execute (see
# RESOLUTIONS.md §2-3). This is the interaction-label-family replicate of
# gauss_k4: identical generative model, smooth nonlinear K-window
# interaction label, coefficients c1,c2 ~ U(0.5,2), c3 ~ U(0.5,1) drawn at
# seed 0, one term per complete group of 4 windows.
J: 5
F: 3
T: 16
K: 4
N: 200
rho: 0.5
alpha: 0.8
seed: 162
label_fn:
  _target_: motionbench.data.synthetic.label_functions.OlsenInteraction
  K: 4
  n_classes: 3
  seed: 0
