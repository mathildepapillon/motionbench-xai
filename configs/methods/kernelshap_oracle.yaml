name: kernelshap_oracle
# Estimand: which deterministic grading target this method's imputer
# defines — 'cond' (conditional game) or 'marg' (marginal game).
game: cond
attributor:
  _target_: motionbench.attribution.kernel_shap.KernelShapAttributor
imputer:
  _target_: motionbench.oracles.gaussian_oracle.GaussianOracle
  # Sigma_joints and Sigma_time are injected at runtime from dataset.oracle
  # by _build_and_fit_imputer in synthetic_eval.py.
  # n_mc controls Monte Carlo samples per conditional draw.
  n_mc: 10
players:
  _target_: motionbench.players.temporal_windows.TemporalWindows
n_kernel_samples: 64
# Matched Monte-Carlo budget: R = 5 fill draws per coalition for every
# stochastic imputer (zero/mean fills are deterministic).
n_completion_samples: 5
seed: 42
# Value-function semantics: 'f_of_mean' = classifier at the mean completion
# (the executed release semantics); 'mean_of_f' = the per-draw alternative (average of
# classifier outputs over completions).
value_fn: f_of_mean
